# Раздача собранного фронтенда и прокси /api/ на бэкенд в сети Docker Compose
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Адрес api разрешается при запросе, а не при старте: контейнер поднимается и без бэкенда
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Файлы сборки с хешем в имени — кешируются надолго
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: любой маршрут отдаёт index.html, роутинг делает React Router
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
