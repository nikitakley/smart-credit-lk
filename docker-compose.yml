# Запуск: docker compose up --build
# Значения по умолчанию подходят для локального запуска; переопределяются через .env (см. .env.example)
name: smart-credit-lk

# Общие настройки бэкенда: один образ используют два сервиса — migrate и api.
# x-... — «заготовка» Compose; &backend даёт ей имя, <<: *backend подставляет её в сервис.
x-backend: &backend
  build: ./backend
  image: smart-credit-lk-backend
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-docker}
    DEMO_MODE: ${DEMO_MODE:-true}
    DEMO_SHOW_SIGN_CODE: ${DEMO_SHOW_SIGN_CODE:-true}
    JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-code-0123456789abcdef}
    JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@postgres:5432/${POSTGRES_DB:-credit}
    # Внешние источники — сервис mocks; у каждого источника свой адрес, как у настоящих сервисов
    EGR_BASE_URL: http://mocks:8001/egr
    NBKI_BASE_URL: http://mocks:8001/nbki
    PB_BASE_URL: http://mocks:8001/pb
    INTEGRATION_API_KEY: ${MOCKS_API_KEY:-local-mocks-key}
    INTEGRATION_TIMEOUT_SECONDS: ${INTEGRATION_TIMEOUT_SECONDS:-3}
    INTEGRATION_RETRIES: ${INTEGRATION_RETRIES:-2}
  volumes:
    # Справочники и демо-данные — только для чтения
    - ./data/seed:/app/data/seed:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit}
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт открыт только для этого компьютера (127.0.0.1) — чтобы локальный uvicorn
    # и инструменты разработчика видели базу. Из сети база недоступна.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Симулятор внешних источников: ЕГРЮЛ/ЕГРИП, НБКИ, ФНС «Прозрачный бизнес».
  # Отдельный сетевой сервис со своим ключом доступа — как настоящие внешние системы.
  mocks:
    build: ./mocks
    image: smart-credit-lk-mocks
    restart: unless-stopped
    environment:
      MOCKS_API_KEY: ${MOCKS_API_KEY:-local-mocks-key}
      MOCK_LATENCY_MIN_MS: ${MOCK_LATENCY_MIN_MS:-300}
      MOCK_LATENCY_MAX_MS: ${MOCK_LATENCY_MAX_MS:-1200}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
    # Swagger симулятора и управление сбоями — только с этого компьютера
    ports:
      - "127.0.0.1:${MOCKS_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Разовая подготовка базы: миграции схемы, затем справочники и демо-заявки.
  # Отрабатывает и завершается (статус Exited (0) — это норма). Повторный запуск безопасен:
  # применённые миграции пропускаются, справочники обновляются, существующие заявки не трогаются.
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # API стартует только после успешной подготовки базы
      migrate:
        condition: service_completed_successfully
      # От симулятора API не зависит жёстко: без него проверки получат статус unavailable, а сам API продолжит работать.
      mocks:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Фронтенд: кабинет клиента и специалиста. nginx раздаёт сборку и проксирует /api на сервис api.
  frontend:
    build: ./frontend
    image: smart-credit-lk-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      # 127.0.0.1, а не localhost: в alpine localhost может уйти в IPv6, а nginx слушает только IPv4
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
