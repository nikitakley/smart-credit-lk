# Запуск: docker compose up --build
# Значения по умолчанию подходят для локального запуска; переопределяются через .env (см. .env.example)
name: smart-credit-lk

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit}
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_SHOW_SIGN_CODE: ${DEMO_SHOW_SIGN_CODE:-true}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me-0123456789abcdef}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@postgres:5432/${POSTGRES_DB:-credit}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: